workflowVersion: 1.0.0
speakeasyVersion: 1.770.0
sources:
    stacks-source:
        inputs:
            - location: registry.speakeasyapi.dev/formance/formance/stacks-source@LATEST_RELEASE
        registry:
            location: registry.speakeasyapi.dev/formance/formance/stacks-source
targets:
    formance-python-sdk:
        target: python
        source: stacks-source
        publish:
            pypi:
                token: $PYPI_TOKEN
        codeSamples:
            registry:
                location: registry.speakeasyapi.dev/formance/formance/stacks-source-python-code-samples
            labelOverride:
                fixedValue: Python (SDK)
            blocking: false
